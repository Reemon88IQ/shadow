<!doctype html><html><head><meta charset="utf-8"><title>TITLE</title>
<!-- Shadow scene template (3.19, "New video"): a working starting point that already follows the scene contract.
     Keep: canvas#c, get('w') / get('h'), window.DURATION, a PURE window.seek(t), window.SOUND + window.STYLE_SOUND,
     window.__ready = true at the end, no autoplay with ?render=1, the seeded rand() (never Math.random / Date.now). -->
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
const get = (k) => new URLSearchParams(location.search).get(k);
const W = +get('w') || 1920, H = +get('h') || Math.round(W * 9 / 16);
const PORTRAIT = H > W;                       // 9:16 Short: lay out vertically, bigger text, keep the bottom 25% calm
const U = Math.min(W, H) / 1080;              // 1 unit = 1 px at 1080p: sizes scale with the video
const c = document.getElementById('c'); c.width = W; c.height = H;
const g = c.getContext('2d');
window.DURATION = 20;                          // seconds (a narrated video: the voice length + about 1.5 s)
window.THUMBNAIL_T = 6;                        // the frame used for the thumbnail

// ---- helpers (pure) ------------------------------------------------------------------------------------------------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const span = (t, a, b) => ease((t - a) / (b - a));          // 0 before a, 1 after b, smooth between
const R = rng(7); const STARS = Array.from({ length: 120 }, () => [R(), R(), R()]);   // made ONCE, the same every render
function text(s, x, y, size, color = '#fff', align = 'center', weight = 700) {
  g.font = `${weight} ${Math.round(size * U)}px "Segoe UI", system-ui, sans-serif`; g.fillStyle = color; g.textAlign = align;
  g.textBaseline = 'middle'; g.fillText(s, x, y);
}

// ---- the picture: everything is a function of t only -----------------------------------------------------------------
window.seek = (t) => {
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#0b1d3a'); bg.addColorStop(1, '#1d0b3a');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  for (const [x, y, s] of STARS) {                          // twinkle = function of t, not of the previous frame
    g.globalAlpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 2 + s * 20)); g.fillStyle = '#fff';
    g.fillRect(x * W, y * H, (1 + 2 * s) * U, (1 + 2 * s) * U);
  }
  g.globalAlpha = span(t, 0.5, 1.5) * (1 - span(t, window.DURATION - 1, window.DURATION));
  text('TITLE', W / 2, H * (PORTRAIT ? 0.32 : 0.42), PORTRAIT ? 110 : 96);
  g.globalAlpha = 1;
};

// ---- sound: a soft music bed rendered offline by Shadow (narration, when there is one, is mixed in by Shadow) ---------
window.SOUND = {
  kit(ctx, o) { return { ctx, voiceover: !!(o && o.voiceover) }; },
  async renderOffline(fn, duration, sr, kitOpts) {
    sr = sr || 48000; const len = Math.ceil(duration * sr), ctx = new OfflineAudioContext(2, len, sr);
    fn(SOUND.kit(ctx, kitOpts || {}));
    const buf = await ctx.startRendering(), L = buf.getChannelData(0), Rr = buf.getChannelData(1), inter = new Float32Array(len * 2);
    let peak = 0; for (let i = 0; i < len; i++) { inter[2 * i] = L[i]; inter[2 * i + 1] = Rr[i]; peak = Math.max(peak, Math.abs(L[i]), Math.abs(Rr[i])); }
    return { inter, peak, frames: len, sr };
  },
  live() { return () => {}; },
};
window.STYLE_SOUND = (k) => {                               // a slow pad: two chords, quieter under a voice
  const ctx = k.ctx, out = ctx.createGain(); out.gain.value = k.voiceover ? 0.035 : 0.12; out.connect(ctx.destination);
  const chords = [[220, 277.2, 329.6], [196, 246.9, 293.7]], D = window.DURATION;
  for (let i = 0, t = 0; t < D; i++, t += 4) for (const f of chords[i % 2]) {
    const o = ctx.createOscillator(), v = ctx.createGain(); o.type = 'triangle'; o.frequency.value = f;
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(0.3, t + 1); v.gain.linearRampToValueAtTime(0, Math.min(D, t + 4.2));
    o.connect(v).connect(out); o.start(t); o.stop(Math.min(D, t + 4.3));
  }
};

if (!get('render')) {                                      // a plain browser preview plays it; Shadow (?render=1) calls seek(t)
  const t0 = performance.now(); (function loop() { window.seek(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); })();
} else { window.seek(0); }
window.__ready = true;
</script></body></html>
