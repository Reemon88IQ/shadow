<!doctype html><meta charset=utf-8><title>2D scene with a minimal SOUND kit (narration test fixture)</title>
<body style="margin:0;background:#000"><canvas id=c></canvas>
<script>
// Smallest Shadow scene that the narration tool accepts: 2D canvas, reads w and h, a SOUND kit with renderOffline/live,
// a STYLE_SOUND score (a quiet 600 Hz hum that voiceover mode turns down), pure seek(t). Sets __ready synchronously,
// so it also covers "the scene was already ready when the narration block ran".
const q = new URLSearchParams(location.search), W = +q.get('w') || 1280, H = +q.get('h') || Math.round(W * 9 / 16);
const c = document.getElementById('c'); c.width = W; c.height = H; const g = c.getContext('2d');
window.DURATION = 4;
window.SOUND = {
  kit(ctx, o) { return { ctx, voiceover: !!(o && o.voiceover) }; },
  async renderOffline(fn, duration, sr, kitOpts) {
    sr = sr || 48000; const len = Math.ceil(duration * sr), ctx = new OfflineAudioContext(2, len, sr);
    fn(SOUND.kit(ctx, kitOpts || {}));
    const buf = await ctx.startRendering(), L = buf.getChannelData(0), R = buf.getChannelData(1), inter = new Float32Array(len * 2);
    let peak = 0; for (let i = 0; i < len; i++) { inter[2 * i] = L[i]; inter[2 * i + 1] = R[i]; peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i])); }
    return { inter, peak, frames: len, sr };
  },
  live(fn, fromT, opts) { return () => {}; },
};
window.STYLE_SOUND = (k) => {
  const o = k.ctx.createOscillator(), v = k.ctx.createGain(); o.frequency.value = 600; v.gain.value = k.voiceover ? 0.02 : 0.08;
  o.connect(v).connect(k.ctx.destination); o.start(0); o.stop(window.DURATION);
};
window.seek = (t) => {
  g.fillStyle = '#16324f'; g.fillRect(0, 0, W, H);
  const r = Math.min(W, H) * 0.12, x = r + (W - 2 * r) * (t / window.DURATION);
  g.fillStyle = '#e9684a'; g.beginPath(); g.arc(x, H * 0.4, r, 0, 7); g.fill();
};
window.seek(0); window.__ready = true;
</script>
